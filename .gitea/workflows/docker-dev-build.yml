name: Build and push docker development images

on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Enable SSH debugging'
        required: false
        default: false

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: git.jonasbernard.de
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build frontend
        working-directory: ./workshops-frontend
        env:
          VERSION_TAG: dev
        run: |
          IMAGE="git.jonasbernard.de/jonas/gruppen-tool-frontend:${VERSION_TAG}"
          docker build -t "${IMAGE}" --build-arg REACT_APP_VERSION=${VERSION_TAG} .

      - name: Push frontend
        env:
          VERSION_TAG: dev
        run: |
          IMAGE="git.jonasbernard.de/jonas/gruppen-tool-frontend:${VERSION_TAG}"
          docker push "${IMAGE}"
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: git.jonasbernard.de
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build backend
        working-directory: ./workshops-backend
        env:
          VERSION_TAG: dev
        run: |
          IMAGE="git.jonasbernard.de/jonas/gruppen-tool-backend:${VERSION_TAG}"
          docker build -t "${IMAGE}" .

      - name: Push backend
        env:
          VERSION_TAG: dev
        run: |
          IMAGE="git.jonasbernard.de/jonas/gruppen-tool-backend:${VERSION_TAG}"
          docker push "${IMAGE}"
  
  backend-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: git.jonasbernard.de
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build backend-v2
        working-directory: ./workshops-backend-v2
        env:
          VERSION_TAG: dev
        run: |
          IMAGE="git.jonasbernard.de/jonas/gruppen-tool-backend-v2:${VERSION_TAG}"
          docker build -t "${IMAGE}" .

      - name: Push backend-v2
        env:
          VERSION_TAG: dev
        run: |
          IMAGE="git.jonasbernard.de/jonas/gruppen-tool-backend-v2:${VERSION_TAG}"
          docker push "${IMAGE}"

  deploy:
    runs-on: ubuntu-latest
    needs: [frontend, backend, backend-v2]

    steps:
      - name: Deploy development
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_KEY_PASS }} 
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          script: |
            cd ${{secrets.COMPOSE_PATH}}
            docker compose pull gruppen-tool-frontend-alpha gruppen-tool-backend-alpha gruppen-tool-backend-v2-alpha 
            docker compose up -d
      - name: Debug with SSH
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled && failure() }}
        uses: mxschmitt/action-tmate@v3



