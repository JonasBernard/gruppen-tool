name: Build and push docker images

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: git.jonasbernard.de
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build frontend
        working-directory: ./workshops-frontend
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="git.jonasbernard.de/jonas/gruppen-tool-frontend:${VERSION_TAG}"
          docker build -t "${IMAGE}" .

      - name: Push frontend
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="git.jonasbernard.de/jonas/gruppen-tool-frontend:${VERSION_TAG}"
          docker push "${IMAGE}"
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: git.jonasbernard.de
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build backend
        working-directory: ./workshops-backend
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="git.jonasbernard.de/jonas/gruppen-tool-backend:${VERSION_TAG}"
          docker build -t "${IMAGE}" .

      - name: Push backend
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="git.jonasbernard.de/jonas/gruppen-tool-backend:${VERSION_TAG}"
          docker push "${IMAGE}"
  
  backend-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: git.jonasbernard.de
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build backend-v2
        working-directory: ./workshops-backend-v2
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="git.jonasbernard.de/jonas/gruppen-tool-backend-v2:${VERSION_TAG}"
          docker build -t "${IMAGE}" .

      - name: Push backend-v2
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="git.jonasbernard.de/jonas/gruppen-tool-backend-v2:${VERSION_TAG}"
          docker push "${IMAGE}"
  
