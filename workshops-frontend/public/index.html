<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/undraw_people_re_8spw.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Online Gruppen einteilen"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/undraw_people_re_8spw.svg" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->

    <script>
      let environment = "%NODE_ENV%";
      if (environment === "production") {
        var sc = document.createElement("script");
        sc.setAttribute("src", "https://plausible.jonasbernard.de/js/script.js");
        sc.setAttribute("type", "text/javascript");
        sc.setAttribute("data-domain", "gruppen-tool.jonasbernard.de");
        sc.defer = true;
        document.head.appendChild(sc);
      }
    </script>

    <title>Gruppen-Tool</title>
  </head>
  
  <!-- Matches background of nav bar -->
  <body class="bg-slate-100 dark:bg-gray-800">
    <noscript>JavaScript wird benötigt, um diese Seite anzeigen zu lassen.</noscript>
    <div id="root"></div>
  </body>
</html>
